name: production smoke test

permissions:
  contents: read

on:
  push:
    branches: [main]

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-jammy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for this commit on Vercel
        shell: bash
        run: |
          for attempt in {1..60}; do
            deployed_sha="$(curl --fail --silent --show-error https://www.sena-v.com/version || true)"
            if [ "$deployed_sha" = "$GITHUB_SHA" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for commit $GITHUB_SHA" >&2
          exit 1

      - name: Run production smoke test
        env:
          PLAYWRIGHT_BASE_URL: https://www.sena-v.com/
        run: npm run e2e:playwright

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
