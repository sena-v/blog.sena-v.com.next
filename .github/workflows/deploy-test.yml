name: production smoke test

permissions:
  contents: read

on:
  push:
    branches: [main]

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-jammy@sha256:c064e7f355d2dda32f669801a1b09e86a1e9252395c844d2cfbbe5c44acb9b79
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for this commit on Vercel
        shell: bash
        run: |
          for attempt in {1..60}; do
            deployed_sha="$(curl --location --fail --silent --show-error --connect-timeout 5 --max-time 10 https://sena-v.com/version || true)"
            if [ "$deployed_sha" = "$GITHUB_SHA" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for commit $GITHUB_SHA" >&2
          exit 1

      - name: Run production smoke test
        env:
          PLAYWRIGHT_BASE_URL: https://sena-v.com/
        run: npm run e2e:playwright

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
