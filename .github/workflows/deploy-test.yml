name: production smoke test

permissions:
  contents: read

on:
  push:
    branches: [main]

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-jammy@sha256:b3251f7ff1a9fa559a28d1c67eaa15fc1a9800f7845e82756caea7842967f615
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for this commit on Vercel
        shell: bash
        run: |
          for attempt in {1..60}; do
            deployed_sha="$(curl --location --fail --silent --show-error --connect-timeout 5 --max-time 10 https://sena-v.com/version || true)"
            if [ "$deployed_sha" = "$GITHUB_SHA" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for commit $GITHUB_SHA" >&2
          exit 1

      - name: Run production smoke test
        env:
          PLAYWRIGHT_BASE_URL: https://sena-v.com/
        run: npm run e2e:playwright

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
